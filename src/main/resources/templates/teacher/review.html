<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="ru">
<head th:replace="~{fragments/head :: head('Открытые ответы')}"></head>
<body>
<header th:replace="~{fragments/header :: header('teacher')}"></header>

<main class="ss-section" style="max-width:760px">
  <p class="ss-kicker ss-reveal">Панель учителя</p>
  <h1 class="ss-reveal" style="font-size:28px;margin-bottom:6px">Открытые ответы тестов</h1>
  <p class="ss-hint ss-reveal">Попытки с вопросами, требующими ручной проверки.</p>

  <div th:if="${#lists.isEmpty(attempts)}" class="ss-empty ss-reveal">
    <p>Нечего проверять — все тесты с автопроверкой. ☀️</p>
  </div>

  <div class="ss-rowcard ss-reveal" th:each="a : ${attempts}">
    <i data-lucide="message-square" aria-hidden="true" style="color:var(--sun-3)"></i>
    <div style="flex:1">
      <b th:text="${a.student.fullName}">Ученик</b>
      <div class="ss-tiny" th:text="|${a.quiz.lesson.course.title} · ${a.quiz.title} · попытка ${a.attemptNo}|">тест</div>
    </div>
    <a class="ss-btn ss-btn--primary ss-btn--sm" th:href="@{'/teacher/review/' + ${a.id}}">Проверить</a>
  </div>
</main>

<footer th:replace="~{fragments/footer :: footer}"></footer>
</body>
</html>
