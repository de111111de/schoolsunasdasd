<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="ru">
<body>
<header class="ss-header" th:fragment="header(active)">
  <a class="ss-logo" th:href="@{/}" aria-label="SCHOOLSUN — на главную">
    <svg width="40" height="40" viewBox="0 0 64 64" aria-hidden="true">
      <defs>
        <linearGradient id="ss-lh" x1="0" y1="0" x2="1" y2="1">
          <stop offset="0" stop-color="#FFD93D"/><stop offset=".5" stop-color="#FFB347"/><stop offset="1" stop-color="#FF8C42"/>
        </linearGradient>
      </defs>
      <g class="ss-logo__rays" stroke="url(#ss-lh)" stroke-width="3.4" stroke-linecap="round">
        <line x1="49" y1="26" x2="56" y2="26"/><line x1="44" y1="14" x2="49" y2="9"/>
        <line x1="32" y1="9" x2="32" y2="2"/><line x1="20" y1="14" x2="15" y2="9"/>
        <line x1="15" y1="26" x2="8" y2="26"/><line x1="20" y1="38" x2="15" y2="43"/>
        <line x1="32" y1="43" x2="32" y2="50"/><line x1="44" y1="38" x2="49" y2="43"/>
      </g>
      <circle cx="32" cy="26" r="11" fill="url(#ss-lh)"/>
      <path d="M9 45c8-4.6 15-4.6 23-.4 8-4.2 15-4.2 23 .4v7c-8-4.6-15-4.6-23-.4-8-4.2-15-4.2-23 .4z" fill="currentColor"/>
      <path d="M32 44.6v7" stroke="currentColor" stroke-width="2" stroke-linecap="round"/>
    </svg>
    <span class="ss-logo__word">SCHOOL<b>SUN</b></span>
  </a>

  <nav class="ss-nav" id="ss-nav" aria-label="Основная навигация">
    <a th:href="@{/}" th:classappend="${active=='home'} ? active">Главная</a>
    <a th:href="@{/courses}" th:classappend="${active=='courses'} ? active">Курсы</a>
    <a th:href="@{/student}" th:if="${me != null && me.role.name() == 'STUDENT'}"
       th:classappend="${active=='student'} ? active">Мой кабинет</a>
    <a th:href="@{/student/leaderboard}" th:if="${me != null && me.role.name() == 'STUDENT'}"
       th:classappend="${active=='leaderboard'} ? active">Рейтинг</a>
    <a th:href="@{/teacher}" th:if="${me != null && (me.role.name() == 'TEACHER' || me.role.name() == 'ADMIN')}"
       th:classappend="${active=='teacher'} ? active">Панель учителя</a>
    <a th:href="@{/admin}" th:if="${me != null && me.role.name() == 'ADMIN'}"
       th:classappend="${active=='admin'} ? active">Админка</a>
  </nav>

  <div class="ss-header__actions">
    <button class="ss-theme" id="ss-theme" type="button" aria-pressed="false" aria-label="Переключить светлую и тёмную тему">
      <svg class="ss-theme__sun" viewBox="0 0 24 24" fill="none" stroke="#FF8C42" stroke-width="2" stroke-linecap="round" aria-hidden="true">
        <circle cx="12" cy="12" r="4.4" fill="#FFB347" stroke="none"/>
        <path d="M12 2.5v2.4M12 19.1v2.4M2.5 12h2.4M19.1 12h2.4M5 5l1.7 1.7M17.3 17.3L19 19M19 5l-1.7 1.7M6.7 17.3L5 19"/>
      </svg>
      <svg class="ss-theme__moon" viewBox="0 0 24 24" aria-hidden="true">
        <path d="M20 14.5A8.5 8.5 0 0 1 9.5 4 8.5 8.5 0 1 0 20 14.5z" fill="#FFD93D"/>
      </svg>
    </button>

    <a class="ss-userchip" th:if="${me != null}"
       th:href="${me.role.name() == 'ADMIN'} ? @{/admin} : (${me.role.name() == 'TEACHER'} ? @{/teacher} : @{/student})">
      <span class="ss-avatar" th:text="${me.fullName.split(' ')[0].substring(0,1)}">А</span>
      <span th:text="${me.fullName.split(' ')[0]}">Аня</span>
    </a>
    <form th:if="${me != null}" th:action="@{/logout}" method="post" style="display:inline">
      <div th:replace="~{fragments/logo :: csrf}"></div>
      <button class="ss-btn ss-btn--ghost ss-btn--sm" type="submit">Выйти</button>
    </form>

    <a class="ss-btn ss-btn--ghost ss-btn--sm" th:if="${me == null}" th:href="@{/login}">Войти</a>
    <a class="ss-btn ss-btn--primary ss-btn--sm" th:if="${me == null}" th:href="@{/register}">Регистрация</a>

    <button class="ss-burger" id="ss-burger" type="button" aria-label="Открыть меню">
      <span></span><span></span><span></span>
    </button>
  </div>
  <i class="ss-header__progress" aria-hidden="true"></i>
</header>
</body>
</html>
