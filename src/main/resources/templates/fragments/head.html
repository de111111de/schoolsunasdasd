<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="ru">
<head th:fragment="head(title)">
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title th:text="${title} + ' — SCHOOLSUN'">SCHOOLSUN</title>
  <link rel="icon" type="image/svg+xml" th:href="@{/img/favicon.svg}">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Unbounded:wght@500;600;700&family=Onest:wght@400;500;600;700;800&family=Playfair+Display:ital,wght@1,500&display=swap" rel="stylesheet">
  <script>
    /* до первой отрисовки: помечаем, что JS есть, и сразу включаем сохранённую тему */
    (function (r) {
      r.classList.add('ss-js');
      try { if (localStorage.getItem('ss-theme') === 'night') r.setAttribute('data-night', ''); } catch (e) {}
    })(document.documentElement);
  </script>
  <noscript><style>.ss-reveal { opacity: 1 !important; transform: none !important; }</style></noscript>
  <link rel="stylesheet" th:href="@{/css/tokens.css}">
  <link rel="stylesheet" th:href="@{/css/base.css}">
  <link rel="stylesheet" th:href="@{/css/header.css}">
  <link rel="stylesheet" th:href="@{/css/hero.css}">
  <link rel="stylesheet" th:href="@{/css/buttons.css}">
  <link rel="stylesheet" th:href="@{/css/components.css}">
  <link rel="stylesheet" th:href="@{/css/cards.css}">
  <link rel="stylesheet" th:href="@{/css/pages.css}">
  <link rel="stylesheet" th:href="@{/css/footer.css}">
  <meta name="_csrf" th:content="${_csrf != null} ? ${_csrf.token} : ''">
  <meta name="_csrf_header" th:content="${_csrf != null} ? ${_csrf.headerName} : 'X-CSRF-TOKEN'">
  <script id="ss-lucide" src="https://unpkg.com/lucide@latest" async></script>
  <script th:src="@{/js/vendor/gsap.min.js}" defer></script>
  <script th:src="@{/js/vendor/ScrollTrigger.min.js}" defer></script>
  <script th:src="@{/js/main.js}" defer></script>
</head>
</html>
