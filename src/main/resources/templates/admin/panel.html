<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="ru">
<head th:replace="~{fragments/head :: head('Админка')}"></head>
<body>
<header th:replace="~{fragments/header :: header('admin')}"></header>

<main class="ss-section">
  <p class="ss-kicker ss-reveal">SCHOOLSUN</p>
  <h1 class="ss-reveal" style="font-size:28px;margin-bottom:20px">Панель администратора</h1>

  <section class="ss-reveal" style="margin-bottom:34px">
    <p class="ss-kicker">Пользователи (<span th:text="${#lists.size(users)}">0</span>)</p>
    <div class="ss-card ss-tablewrap">
      <table class="ss-table">
        <thead>
        <tr><th>Имя</th><th>Email</th><th>Роль</th><th>Статус</th><th>Действия</th></tr>
        </thead>
        <tbody>
        <tr th:each="u : ${users}">
          <td><b th:text="${u.fullName}">Имя</b></td>
          <td class="ss-mut ss-tiny" th:text="${u.email}">email</td>
          <td>
            <form class="ss-inline-form" th:action="@{'/admin/users/' + ${u.id} + '/role'}" method="post"
                  th:if="${u.id != me.id}">
              <div th:replace="~{fragments/logo :: csrf}"></div>
              <select class="ss-select" name="role">
                <option value="STUDENT" th:selected="${u.role.name() == 'STUDENT'}">Ученик</option>
                <option value="TEACHER" th:selected="${u.role.name() == 'TEACHER'}">Учитель</option>
                <option value="ADMIN" th:selected="${u.role.name() == 'ADMIN'}">Админ</option>
              </select>
              <button class="ss-btn ss-btn--ghost ss-btn--sm" type="submit">OK</button>
            </form>
            <span class="ss-badge ss-badge--info" th:if="${u.id == me.id}"><i></i><span th:text="${u.role.name()}">ты</span></span>
          </td>
          <td>
            <span class="ss-badge ss-badge--ok" th:if="${!u.blocked}"><i></i>активен</span>
            <span class="ss-badge ss-badge--danger" th:if="${u.blocked}"><i></i>заблокирован</span>
          </td>
          <td>
            <form th:action="@{'/admin/users/' + ${u.id} + '/block'}" method="post" th:if="${u.id != me.id}">
              <div th:replace="~{fragments/logo :: csrf}"></div>
              <button class="ss-btn ss-btn--ghost ss-btn--sm" type="submit"
                      th:text="${u.blocked} ? 'Разблокировать' : 'Заблокировать'">Заблокировать</button>
            </form>
          </td>
        </tr>
        </tbody>
      </table>
    </div>
  </section>

  <section class="ss-reveal">
    <p class="ss-kicker">Все курсы (<span th:text="${#lists.size(courses)}">0</span>)</p>
    <div class="ss-card ss-tablewrap">
      <table class="ss-table">
        <thead>
        <tr><th>Курс</th><th>Учитель</th><th>Статус</th><th>Действия</th></tr>
        </thead>
        <tbody>
        <tr th:each="c : ${courses}">
          <td><b><a th:href="@{'/courses/' + ${c.slug}}" th:text="${c.title}">Курс</a></b></td>
          <td class="ss-mut ss-tiny" th:text="${c.teacher.fullName}">Учитель</td>
          <td>
            <span class="ss-badge ss-badge--ok" th:if="${c.published}"><i></i>опубликован</span>
            <span class="ss-badge ss-badge--warn" th:if="${!c.published}"><i></i>черновик</span>
          </td>
          <td>
            <div style="display:flex;gap:6px;flex-wrap:wrap">
              <form th:action="@{'/admin/courses/' + ${c.id} + '/publish'}" method="post">
                <div th:replace="~{fragments/logo :: csrf}"></div>
                <button class="ss-btn ss-btn--ghost ss-btn--sm" type="submit"
                        th:text="${c.published} ? 'Снять' : 'Опубликовать'">Опубликовать</button>
              </form>
              <form th:action="@{'/admin/courses/' + ${c.id} + '/delete'}" method="post"
                    onsubmit="return confirm('Удалить курс безвозвратно?')">
                <div th:replace="~{fragments/logo :: csrf}"></div>
                <button class="ss-btn ss-btn--danger ss-btn--sm" type="submit">Удалить</button>
              </form>
            </div>
          </td>
        </tr>
        </tbody>
      </table>
    </div>
  </section>
</main>

<footer th:replace="~{fragments/footer :: footer}"></footer>
</body>
</html>
