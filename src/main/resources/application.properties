spring.application.name=SCHOOLSUN

# ---------- База данных ----------
# По умолчанию — H2 в файловом режиме (ничего устанавливать не нужно).
# Файл базы появится в папке ./data проекта.
# Для PostgreSQL: запуск с профилем  --spring.profiles.active=postgres
# (настройки в application-postgres.properties).
spring.datasource.url=jdbc:h2:file:./data/schoolsun;MODE=PostgreSQL;AUTO_SERVER=TRUE
spring.datasource.username=sa
spring.datasource.password=
spring.jpa.hibernate.ddl-auto=none
spring.jpa.open-in-view=true

spring.flyway.enabled=true

# ---------- Приложение ----------
app.upload.dir=./uploads
app.pass-percent=60

spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=25MB

server.error.whitelabel.enabled=false
