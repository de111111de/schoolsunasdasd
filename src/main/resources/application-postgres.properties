# Профиль PostgreSQL:  java -jar schoolsun.jar --spring.profiles.active=postgres
# Перед запуском создать базу и пользователя:
#   CREATE DATABASE schoolsun;
#   CREATE USER schoolsun WITH PASSWORD 'schoolsun';
#   GRANT ALL PRIVILEGES ON DATABASE schoolsun TO schoolsun;
spring.datasource.url=jdbc:postgresql://localhost:5432/schoolsun
spring.datasource.username=schoolsun
spring.datasource.password=schoolsun
spring.jpa.hibernate.ddl-auto=none
